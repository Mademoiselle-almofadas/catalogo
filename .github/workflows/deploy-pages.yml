name: Publicar site (GitHub Actions)

# Caminho ALTERNATIVO de publicação do GitHub Pages.
#
# Por que existe: o mecanismo padrão ("Deploy from a branch") entrou em
# "Timeout reached, aborting!" no passo de deploy, de forma repetida, mesmo
# com o build passando em 29 segundos e com o conteúdo do repositório
# inalterado. Este workflow usa a via oficial de Actions (upload-pages-artifact
# + deploy-pages), que é um caminho de infraestrutura diferente.
#
# COMO LIGAR:
#   1) Suba este arquivo no repositório em:  .github/workflows/deploy-pages.yml
#   2) Settings -> Pages -> Source: mude para "GitHub Actions"
#   3) Pronto: cada push na main publica sozinho.
#
# A URL continua exatamente a mesma:
#   https://mademoiselle-almofadas.github.io/catalogo/

on:
  push:
    branches: [main]
  workflow_dispatch:        # permite disparar na mão pela aba Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Não cancela um deploy em andamento: evita o ciclo de builds se cancelando
# que aconteceu quando o arquivo foi subido várias vezes seguidas.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      # Publica o site como está, sem Jekyll. O app é um HTML único mais
      # imagens — não há nada pra processar, e pular o Jekyll deixa o
      # processo mais curto e com menos partes que podem falhar.
      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
        timeout-minutes: 20
