<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Mademoiselle Almofadas — Catálogo</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #F7F3EE;
    --warm: #EDE6DC;
    --gold: #B89B6A;
    --gold-light: #D4B98A;
    --dark: #1C1814;
    --mid: #6B5F52;
    --soft: #9E8E7E;
    --white: #FDFAF7;
    --shadow: rgba(28,24,20,0.10);
  }

  html, body {
    height: 100%;
    background: var(--cream);
    color: var(--dark);
    font-family: 'Jost', sans-serif;
    font-weight: 300;
  }

  /* ── HEADER ── */
  header {
    background: var(--dark);
    padding: 22px 24px 18px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .brand-tag {
    font-family: 'Jost', sans-serif;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: .28em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .brand-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 26px;
    font-weight: 300;
    color: var(--white);
    letter-spacing: .08em;
  }

  .brand-name em {
    font-style: italic;
    color: var(--gold-light);
  }

  .header-logo {
    display: block;
    height: 120px;
    width: 120px;
    object-fit: contain;
    margin: 0 auto;
  }

  /* ── SEARCH AREA ── */
  .search-wrap {
    padding: 28px 20px 16px;
    max-width: 520px;
    margin: 0 auto;
  }

  .search-label {
    font-size: 10px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--soft);
    margin-bottom: 10px;
    display: block;
  }

  .search-row {
    display: flex;
    gap: 10px;
    align-items: stretch;
  }

  .search-input {
    flex: 1;
    background: var(--white);
    border: 1.5px solid var(--warm);
    border-radius: 4px;
    padding: 14px 18px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px;
    font-weight: 400;
    color: var(--dark);
    letter-spacing: .06em;
    outline: none;
    transition: border-color .2s;
    -webkit-appearance: none;
  }

  .search-input::placeholder {
    color: var(--soft);
    opacity: .5;
  }

  .search-input:focus {
    border-color: var(--gold);
  }

  .search-btn {
    background: var(--dark);
    border: none;
    border-radius: 4px;
    padding: 0 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .2s;
    -webkit-tap-highlight-color: transparent;
  }

  .search-btn:active { background: var(--mid); }

  .search-btn svg {
    width: 20px;
    height: 20px;
    stroke: var(--gold-light);
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* ── ESTADO ── */
  #status {
    text-align: center;
    padding: 10px 20px 0;
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--soft);
    min-height: 24px;
  }

  /* ── DIVIDER ── */
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 20px 0;
    max-width: 520px;
    margin: 0 auto;
  }
  .divider-line { flex: 1; height: 1px; background: var(--warm); }
  .divider-text { font-size: 9px; letter-spacing: .18em; color: var(--soft); text-transform: uppercase; }

  /* ── GRID ── */
  #grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding: 16px 16px 40px;
    max-width: 800px;
    margin: 0 auto;
  }

  @media (min-width: 600px) {
    #grid { grid-template-columns: repeat(3, 1fr); }
  }

  /* ── CARD ── */
  .card {
    background: var(--white);
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 2px 12px var(--shadow);
    animation: fadeUp .35s ease both;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card:nth-child(2) { animation-delay: .05s; }
  .card:nth-child(3) { animation-delay: .10s; }
  .card:nth-child(4) { animation-delay: .15s; }
  .card:nth-child(5) { animation-delay: .20s; }
  .card:nth-child(6) { animation-delay: .25s; }

  .card-img-wrap {
    position: relative;
    aspect-ratio: 1 / 1;
    background: var(--warm);
    overflow: hidden;
  }

  .card-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform .4s ease;
  }

  .card:active .card-img-wrap img {
    transform: scale(1.04);
  }

  .card-loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .spinner {
    width: 24px;
    height: 24px;
    border: 2px solid var(--warm);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .card-info {
    padding: 10px 12px 12px;
    border-top: 1px solid var(--warm);
  }

  .card-ref {
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--gold);
    letter-spacing: .08em;
    display: block;
    margin-bottom: 2px;
  }

  .card-nome {
    font-size: 10px;
    color: var(--soft);
    letter-spacing: .04em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── LIGHTBOX ── */
  #lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(28,24,20,.92);
    z-index: 200;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  #lightbox.open { display: flex; }

  #lightbox img {
    max-width: 100%;
    max-height: 75vh;
    object-fit: contain;
    border-radius: 4px;
    box-shadow: 0 8px 40px rgba(0,0,0,.4);
  }

  #lightbox-info {
    margin-top: 16px;
    text-align: center;
  }

  #lightbox-ref {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    color: var(--gold-light);
    letter-spacing: .1em;
  }

  #lightbox-nome {
    font-size: 11px;
    color: var(--soft);
    margin-top: 4px;
    letter-spacing: .06em;
  }

  #lightbox-close {
    position: absolute;
    top: 16px;
    right: 20px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 8px;
    -webkit-tap-highlight-color: transparent;
  }

  #lightbox-close svg {
    width: 24px;
    height: 24px;
    stroke: var(--soft);
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
  }

  /* ── EMPTY STATE ── */
  .empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 48px 20px;
  }

  .empty-icon {
    font-family: 'Cormorant Garamond', serif;
    font-size: 48px;
    color: var(--warm);
    margin-bottom: 12px;
  }

  .empty-text {
    font-size: 13px;
    color: var(--soft);
    letter-spacing: .06em;
  }

  /* ── LOADING INICIAL ── */
  #loading-screen {
    position: fixed;
    inset: 0;
    background: var(--cream);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    z-index: 300;
    transition: opacity .4s;
  }

  #loading-screen.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .loading-brand {
    font-family: 'Cormorant Garamond', serif;
    font-size: 32px;
    font-weight: 300;
    color: var(--dark);
    letter-spacing: .1em;
  }

  .loading-brand em { color: var(--gold); font-style: italic; }

  .loading-bar-wrap {
    width: 140px;
    height: 2px;
    background: var(--warm);
    border-radius: 2px;
    overflow: hidden;
  }

  .loading-bar {
    height: 100%;
    background: var(--gold);
    border-radius: 2px;
    animation: loadBar 1.8s ease forwards;
  }

  @keyframes loadBar { from { width: 0; } to { width: 100%; } }

  .loading-txt {
    font-size: 10px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--soft);
  }

  /* ── LOGIN ── */
  #login-screen {
    position: fixed;
    inset: 0;
    background: var(--dark);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 400;
    padding: 24px;
    transition: opacity .4s;
  }

  #login-screen.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .login-logo {
    display: block;
    height: 140px;
    width: 140px;
    object-fit: contain;
    margin: 0 auto 40px;
  }

  .login-box {
    background: var(--cream);
    border-radius: 8px;
    padding: 32px 28px;
    width: 100%;
    max-width: 360px;
  }

  .login-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--soft);
    text-align: center;
    margin-bottom: 24px;
  }

  .login-field {
    margin-bottom: 14px;
  }

  .login-label {
    font-size: 10px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--soft);
    display: block;
    margin-bottom: 6px;
  }

  .login-input {
    width: 100%;
    background: var(--white);
    border: 1.5px solid var(--warm);
    border-radius: 4px;
    padding: 12px 14px;
    font-family: 'Jost', sans-serif;
    font-size: 15px;
    color: var(--dark);
    outline: none;
    transition: border-color .2s;
    -webkit-appearance: none;
  }

  .login-input:focus { border-color: var(--gold); }

  .login-btn {
    width: 100%;
    background: var(--dark);
    color: var(--gold-light);
    border: none;
    border-radius: 4px;
    padding: 14px;
    font-family: 'Jost', sans-serif;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: .2em;
    text-transform: uppercase;
    cursor: pointer;
    margin-top: 8px;
    transition: background .2s;
    -webkit-tap-highlight-color: transparent;
  }

  .login-btn:active { background: var(--mid); }

  .login-erro {
    font-size: 11px;
    color: #c0392b;
    text-align: center;
    margin-top: 10px;
    min-height: 16px;
    letter-spacing: .04em;
  }

  .login-bemvindo {
    font-size: 11px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--soft);
    text-align: right;
    padding: 8px 20px 0;
  }

  .login-bemvindo span { color: var(--gold); font-weight: 500; }

  .logout-btn {
    background: none;
    border: none;
    font-size: 10px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--soft);
    cursor: pointer;
    padding: 4px 8px;
    text-decoration: underline;
    -webkit-tap-highlight-color: transparent;
  }

</style>
</head>

];

const SHEET_ID = "12D8u5zgYokftP_tEKnF1Dkw9zrfyUUJZED_v7DvFdI8";
const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Sheet1`;

let dados = [];

// Carrega planilha na inicialização
async function carregarPlanilha() {
  try {
    const res = await fetch(SHEET_URL);
    const txt = await res.text();
    const json = JSON.parse(txt.substring(47).slice(0, -2));
    const rows = json.table.rows;

    dados = rows
      .filter(r => r.c && r.c[1] && r.c[1].v)
      .map(r => {
        // Nome do arquivo pode estar na coluna 2 ou 3
        const nomeRaw = (r.c[2] && r.c[2].v) ? String(r.c[2].v).trim()
                      : (r.c[3] && r.c[3].v) ? String(r.c[3].v).trim() : '';
        // Referencia: coluna A se existir, senao pega do nome do arquivo
        let ref = '';
        if (r.c[0] && r.c[0].v !== null && r.c[0].v !== undefined) {
          ref = String(r.c[0].f ?? r.c[0].v).trim();
        } else if (nomeRaw) {
          ref = nomeRaw.split('-')[0].replace(/\.[^/.]+$/, '').trim();
        }
        const link = String(r.c[1].v).trim()
          .replace('uc?export=view&id=', 'thumbnail?sz=w800&id=')
          .replace('uc?export=download&id=', 'thumbnail?sz=w800&id=');
        return { ref, link, nome: nomeRaw };
      })
      .filter(d => d.ref && d.link);

    document.getElementById('loading-screen').classList.add('hidden');
    document.getElementById('status').textContent = dados.length + ' fotos carregadas';
    setTimeout(() => { document.getElementById('status').textContent = ''; }, 2500);
  } catch(e) {
    document.getElementById('loading-screen').classList.add('hidden');
    document.getElementById('status').textContent = 'Erro ao carregar planilha';
    console.error(e);
  }
}

function buscar() {
  const q = document.getElementById('search-input').value.trim();
  const grid = document.getElementById('grid');
  const status = document.getElementById('status');
  const divLabel = document.getElementById('divider-label');

  grid.innerHTML = '';

  if (!q) {
    status.textContent = 'Digite uma referência para buscar';
    return;
  }

  // Normaliza busca: maiúsculo, remove zeros à esquerda em refs numéricas
  // Suporta: "076"→76, "537", "9999", "NT38", "NT38R"
  const qUp = q.toUpperCase().trim();
  const qBase = qUp.replace(/R$/, '');           // NT38R → NT38 (busca base)
  const qNum  = parseInt(qBase, 10) || null;     // "076"→76, "NT38"→NaN→null

  const resultados = dados.filter(d => {
    const ref  = String(d.ref).toUpperCase().trim();
    const nome = String(d.nome).toUpperCase();
    const nomeBloco = nome.split('-')[0];         // primeiro bloco do arquivo

    // Normaliza zeros à esquerda para refs numéricas
    const refBase  = ref.replace(/R$/, '');
    const nomeBase = nomeBloco.replace(/R$/, '');

    if (qNum !== null) {
      // Busca numérica: 076→76, ignora zeros à esquerda
      const refNum  = parseInt(refBase, 10);
      const nomeNum = parseInt(nomeBase, 10);
      return refNum === qNum || nomeNum === qNum;
    } else {
      // Busca alfanumérica: NT38 encontra NT38 e NT38R
      return refBase === qBase || nomeBase === qBase;
    }
  });

  if (resultados.length === 0) {
    status.textContent = 'Nenhum produto encontrado';
    divLabel.textContent = 'Sem resultados';
    grid.innerHTML = `
      <div class="empty">
        <div class="empty-icon">✦</div>
        <div class="empty-text">Referência não encontrada</div>
      </div>`;
    return;
  }

  status.textContent = '';
  divLabel.textContent = resultados.length + (resultados.length === 1 ? ' variação encontrada' : ' variações encontradas');

  resultados.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.animationDelay = (i * 0.06) + 's';
    card.innerHTML = `
      <div class="card-img-wrap">
        <div class="card-loading"><div class="spinner"></div></div>
        <img src="${item.link}" alt="${item.nome}" loading="lazy"
          onload="this.previousElementSibling.style.display='none'"
          onerror="this.previousElementSibling.style.display='none'; this.style.display='none'">
      </div>
      <div class="card-info">
        <span class="card-ref">${item.ref}</span>
        <span class="card-nome">${item.nome}</span>
      </div>`;
    card.onclick = () => abrirLightbox(item);
    grid.appendChild(card);
  });
}

function abrirLightbox(item) {
  document.getElementById('lightbox-img').src = item.link;
  document.getElementById('lightbox-ref').textContent = item.ref;
  document.getElementById('lightbox-nome').textContent = item.nome;
  document.getElementById('lightbox').classList.add('open');
}

function fecharLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

// Enter busca
document.getElementById('search-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') buscar();
});

// Fecha lightbox clicando fora
document.getElementById('lightbox').addEventListener('click', function(e) {
  if (e.target === this) fecharLightbox();
});


// ── LOGIN ──
function fazerLogin() {
  const u = document.getElementById('login-usuario').value.trim().toLowerCase();
  const s = document.getElementById('login-senha').value.trim();
  const rep = USUARIOS.find(r => r.usuario === u && r.senha === s);
  if (rep) {
    sessionStorage.setItem('logado', JSON.stringify(rep));
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('bemvindo-txt').innerHTML = 'Olá, <span>' + rep.nome + '</span>';
    carregarPlanilha();
  } else {
    document.getElementById('login-erro').textContent = 'Usuário ou senha incorretos';
    setTimeout(() => { document.getElementById('login-erro').textContent = ''; }, 3000);
  }
}

function fazerLogout() {
  sessionStorage.removeItem('logado');
  location.reload();
}

// Enter no campo de senha
document.getElementById('login-senha').addEventListener('keydown', e => {
  if (e.key === 'Enter') fazerLogin();
});
document.getElementById('login-usuario').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('login-senha').focus();
});

// Verifica se já está logado
const _logado = sessionStorage.getItem('logado');
if (_logado) {
  const rep = JSON.parse(_logado);
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('bemvindo-txt').innerHTML = 'Olá, <span>' + rep.nome + '</span>';
  carregarPlanilha();
}

</script>
