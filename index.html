<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Mademoiselle Almofadas</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mademoiselle">
<meta name="theme-color" content="#1C1814">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--cream:#F7F3EE;--warm:#EDE6DC;--gold:#B89B6A;--gold-light:#D4B98A;--dark:#1C1814;--mid:#6B5F52;--soft:#9E8E7E;--white:#FDFAF7}
html,body{height:100%;background:var(--cream);color:var(--dark);font-family:'Jost',sans-serif;font-weight:300}
header{background:var(--dark);padding:22px 24px 0;text-align:center;position:sticky;top:0;z-index:100}
.brand-tag{font-size:9px;font-weight:500;letter-spacing:.28em;color:var(--gold);text-transform:uppercase;margin-bottom:4px}
.header-logo{display:block;height:70px;width:320px;object-fit:contain;margin:0 auto}
.abas{display:flex;border-top:1px solid rgba(255,255,255,.08);margin-top:8px}
.aba-btn{flex:1;background:none;border:none;padding:10px 0;font-family:'Jost',sans-serif;font-size:10px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);cursor:pointer;border-bottom:2px solid transparent;transition:color .2s,border-color .2s}
.aba-btn.ativa{color:var(--gold-light);border-bottom-color:var(--gold)}
#busca-screen{display:none}
#busca-screen.ativo{display:block}
#galeria-screen{display:none}
#galeria-screen.ativo{display:block}
.boas-vindas{display:flex;align-items:center;justify-content:space-between;padding:8px 20px 0;max-width:520px;margin:0 auto}
.bemvindo{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
.bemvindo span{color:var(--gold);font-weight:500}
.sair-btn{background:none;border:none;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);cursor:pointer;text-decoration:underline}
.search-wrap{padding:20px 20px 12px;max-width:520px;margin:0 auto}
.search-label{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);margin-bottom:10px;display:block}
.search-row{display:flex;gap:10px}
.search-input{flex:1;background:var(--white);border:1.5px solid var(--warm);border-radius:4px;padding:14px 18px;font-family:'Cormorant Garamond',serif;font-size:28px;color:var(--dark);letter-spacing:.06em;outline:none;-webkit-appearance:none}
.search-input:focus{border-color:var(--gold)}
.search-btn{background:var(--dark);border:none;border-radius:4px;padding:0 22px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.search-btn svg{width:20px;height:20px;stroke:var(--gold-light);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#status{text-align:center;padding:8px 20px 0;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);min-height:22px}
.divider{display:flex;align-items:center;gap:12px;padding:6px 20px 0;max-width:520px;margin:0 auto}
.divider-line{flex:1;height:1px;background:var(--warm)}
.divider-text{font-size:9px;letter-spacing:.18em;color:var(--soft);text-transform:uppercase}
#grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:16px 16px 40px;max-width:800px;margin:0 auto}
@media(min-width:600px){#grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--white);border-radius:6px;overflow:hidden;box-shadow:0 2px 12px rgba(28,24,20,0.1);cursor:pointer;animation:fadeUp .35s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.card-img{aspect-ratio:4/3;background:var(--warm);overflow:hidden;position:relative}
.card-img img{width:100%;height:100%;object-fit:contain;display:block}
.card-spin{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.spinner{width:24px;height:24px;border:2px solid var(--warm);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.card-info{padding:10px 12px 12px;border-top:1px solid var(--warm)}
.card-ref{font-family:'Cormorant Garamond',serif;font-size:13px;font-weight:600;color:var(--gold);letter-spacing:.08em;display:block;margin-bottom:2px}
.card-nome{font-size:10px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.empty{grid-column:1/-1;text-align:center;padding:48px 20px;color:var(--soft);font-size:13px}
#galeria-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px;max-width:800px;margin:0 auto}
@media(min-width:600px){#galeria-grid{grid-template-columns:repeat(4,1fr)}}
.g-item{background:var(--warm);cursor:pointer}
.g-img{overflow:hidden;background:var(--warm)}
.g-img img{width:100%;height:auto;display:block}
.g-ref{font-family:'Cormorant Garamond',serif;font-size:11px;color:var(--gold);text-align:center;padding:4px 2px 2px;background:var(--white);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-cor{font-size:10px;color:var(--soft);text-align:center;padding:0 2px 4px;background:var(--white);letter-spacing:.06em}
#g-sentinel{height:20px}
#g-status{text-align:center;padding:20px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
#lightbox{display:none;position:fixed;inset:0;background:rgba(28,24,20,.92);z-index:500;flex-direction:column;align-items:center;justify-content:center;padding:20px}
#lightbox.open{display:flex}
#lb-img{max-width:100%;max-height:75vh;object-fit:contain;border-radius:4px}
#lb-ref{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--gold-light);text-align:center;margin-top:16px}
#lb-nome{font-size:11px;color:var(--soft);text-align:center;margin-top:4px}
#lb-close{position:absolute;top:16px;right:20px;background:none;border:none;cursor:pointer;color:var(--soft);font-size:28px;line-height:1}
#loading-screen{position:fixed;inset:0;background:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:300;transition:opacity .4s}
#loading-screen.hidden{opacity:0;pointer-events:none}
.loading-brand{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:300;color:var(--dark);letter-spacing:.1em}
.loading-brand em{color:var(--gold);font-style:italic}
.loading-bar-wrap{width:140px;height:2px;background:var(--warm);border-radius:2px;overflow:hidden}
.loading-bar{height:100%;background:var(--gold);animation:loadBar 1.8s ease forwards}
@keyframes loadBar{from{width:0}to{width:100%}}
.loading-txt{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft)}
#login-screen{position:fixed;inset:0;background:var(--dark);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:400;padding:24px;transition:opacity .4s}
#login-screen.hidden{opacity:0;pointer-events:none}
.login-logo{display:block;height:90px;width:360px;object-fit:contain;margin:0 auto 40px}
.login-box{background:var(--cream);border-radius:8px;padding:32px 28px;width:100%;max-width:360px}
.login-title{font-family:'Cormorant Garamond',serif;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);text-align:center;margin-bottom:24px}
.login-field{margin-bottom:14px}
.login-label{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);display:block;margin-bottom:6px}
.login-input{width:100%;background:var(--white);border:1.5px solid var(--warm);border-radius:4px;padding:12px 14px;font-family:'Jost',sans-serif;font-size:15px;color:var(--dark);outline:none;-webkit-appearance:none}
.login-input:focus{border-color:var(--gold)}
.login-btn{width:100%;background:var(--dark);color:var(--gold-light);border:none;border-radius:4px;padding:14px;font-family:'Jost',sans-serif;font-size:12px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;margin-top:8px}
.login-erro{font-size:11px;color:#c0392b;text-align:center;margin-top:10px;min-height:16px}

.g-filtro-wrap{padding:12px 12px 8px;max-width:800px;margin:0 auto;position:sticky;top:0;background:var(--cream);z-index:10;border-bottom:1px solid var(--warm)}
.g-filtro-row{display:flex;gap:8px;align-items:center}
.g-cats{display:flex;gap:6px;padding:10px 12px 0;max-width:800px;margin:0 auto;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.g-cats::-webkit-scrollbar{display:none}
.g-cat-btn{background:var(--white);color:var(--soft);border:1.5px solid var(--warm);border-radius:20px;padding:6px 14px;font-family:'Jost',sans-serif;font-size:10px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;white-space:nowrap;transition:all .2s;flex-shrink:0}
.g-cat-btn.ativo{background:var(--dark);color:var(--gold-light);border-color:var(--dark)}
.g-filtro-input{flex:1;background:var(--white);border:1.5px solid var(--warm);border-radius:4px;padding:10px 14px;font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--dark);outline:none;-webkit-appearance:none}
.g-filtro-input:focus{border-color:var(--gold)}
.g-filtro-clear{background:none;border:none;color:var(--soft);font-size:18px;cursor:pointer;padding:4px 8px;display:none}
.g-filtro-clear.visible{display:block}
.g-filtro-info{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--soft);text-align:center;padding:4px 0 0}


.card-img{position:relative}
.g-img{position:relative}
.btn-add{position:absolute;bottom:6px;right:6px;background:var(--dark);color:var(--gold-light);border:none;border-radius:50%;width:30px;height:30px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:5;line-height:1}
#fab{position:fixed;bottom:24px;right:20px;background:var(--dark);color:var(--gold-light);border:none;border-radius:50px;padding:12px 18px;font-family:'Jost',sans-serif;font-size:11px;font-weight:500;letter-spacing:.15em;cursor:pointer;z-index:150;display:none;align-items:center;gap:8px;box-shadow:0 4px 16px rgba(0,0,0,.3)}
#fab.visivel{display:flex}
#fab-n{background:var(--gold);color:var(--dark);border-radius:50%;width:20px;height:20px;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
#pedido-screen{display:none}
#pedido-screen.ativo{display:block}
.ped-header{padding:16px 20px 8px;max-width:800px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
.ped-titulo{font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--dark);letter-spacing:.06em}
.ped-limpar{background:none;border:none;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);cursor:pointer;text-decoration:underline}
.ped-lista{max-width:800px;margin:0 auto;padding:0 16px 100px}
.ped-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--warm)}
.ped-img{width:56px;height:56px;object-fit:contain;border-radius:4px;background:var(--warm);flex-shrink:0}
.ped-info{flex:1;min-width:0}
.ped-ref{font-family:'Cormorant Garamond',serif;font-size:13px;font-weight:600;color:var(--gold)}
.ped-nome{font-size:10px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ped-qty{display:flex;align-items:center;gap:6px;flex-shrink:0}
.qty-btn{background:var(--warm);border:none;border-radius:4px;width:28px;height:28px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--dark)}
.qty-n{font-family:'Cormorant Garamond',serif;font-size:16px;color:var(--dark);min-width:24px;text-align:center}
.ped-rem{background:none;border:none;color:var(--soft);font-size:18px;cursor:pointer;padding:4px;flex-shrink:0}
.ped-vazio{text-align:center;padding:60px 20px;font-size:13px;color:var(--soft)}
.ped-footer{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1px solid var(--warm);padding:12px 20px;z-index:160}
.ped-footer-inner{max-width:800px;margin:0 auto}
.btn-email{width:100%;background:var(--dark);color:var(--gold-light);border:none;border-radius:4px;padding:14px;font-family:'Jost',sans-serif;font-size:11px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;cursor:pointer}
.lb-add-row{display:flex;align-items:center;gap:12px;margin-top:14px;justify-content:center;position:relative;z-index:501}
.lb-qty-btn{background:var(--warm);border:none;border-radius:4px;width:40px;height:40px;font-size:22px;cursor:pointer;color:var(--dark);display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.lb-qty-n{font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--white);min-width:30px;text-align:center}
.lb-add-btn{background:var(--gold);color:var(--dark);border:none;border-radius:4px;padding:12px 24px;font-family:'Jost',sans-serif;font-size:11px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;-webkit-tap-highlight-color:transparent}




/* FORMULÁRIO PEDIDO */
#modal-dados{display:none;position:fixed;inset:0;background:rgba(28,24,20,.7);z-index:600;align-items:center;justify-content:center;padding:20px}
#modal-dados.open{display:flex}
.modal-box{background:var(--cream);border-radius:8px;padding:28px;width:100%;max-width:400px;max-height:90vh;overflow-y:auto;position:relative;z-index:601}
.modal-titulo{font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--dark);letter-spacing:.06em;margin-bottom:20px;text-align:center}
.modal-field{margin-bottom:14px}
.modal-label{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);display:block;margin-bottom:6px}
.modal-input{width:100%;background:var(--white);border:1.5px solid var(--warm);border-radius:4px;padding:11px 14px;font-family:'Jost',sans-serif;font-size:14px;color:var(--dark);outline:none;-webkit-appearance:none}
.modal-input:focus{border-color:var(--gold)}
.modal-btns{display:flex;gap:10px;margin-top:20px}
.modal-btn-cancel{flex:1;background:var(--white);color:var(--soft);border:1.5px solid var(--warm);border-radius:4px;padding:12px;font-family:'Jost',sans-serif;font-size:11px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;cursor:pointer}
.modal-btn-ok{flex:2;background:var(--dark);color:var(--gold-light);border:none;border-radius:4px;padding:12px;font-family:'Jost',sans-serif;font-size:11px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;-webkit-tap-highlight-color:transparent;pointer-events:all}
/* HISTÓRICO */
#historico-screen{display:none}
#historico-screen.ativo{display:block}
.hist-header{padding:16px 20px 8px;max-width:800px;margin:0 auto}
.hist-titulo{font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--dark);letter-spacing:.06em}
.hist-lista{max-width:800px;margin:0 auto;padding:0 16px 40px}
.hist-item{background:var(--white);border-radius:6px;padding:14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(28,24,20,.06)}
.hist-num{font-family:'Cormorant Garamond',serif;font-size:15px;font-weight:600;color:var(--gold);margin-bottom:4px}
.hist-info{font-size:11px;color:var(--soft);margin-bottom:6px}
.hist-itens{font-size:11px;color:var(--dark);line-height:1.7;border-top:1px solid var(--warm);padding-top:8px;margin-top:6px}
.hist-vazio{text-align:center;padding:60px 20px;font-size:13px;color:var(--soft)}
/* Botão PDF */
.btn-baixar{width:100%;background:var(--white);color:var(--dark);border:1.5px solid var(--warm);border-radius:4px;padding:14px;font-family:'Jost',sans-serif;font-size:11px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;cursor:pointer}
.btn-pdf{width:100%;background:var(--gold);color:var(--dark);border:none;border-radius:4px;padding:14px;font-family:'Jost',sans-serif;font-size:11px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;margin-top:10px}

</style>
</head>

async function carregarPlanilha() {
  try {
    var url = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?tqx=out:json&sheet=Sheet1";
    var res = await fetch(url);
    var txt = await res.text();
    var json = JSON.parse(txt.substring(47).slice(0, -2));
    var rows = json.table.rows;
    dados = [];
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      if (!r.c || !r.c[1] || !r.c[1].v) continue;
      var nome = (r.c[2] && r.c[2].v) ? String(r.c[2].v).trim() : (r.c[3] && r.c[3].v) ? String(r.c[3].v).trim() : "";
      var ref = "";
      if (r.c[0] && r.c[0].v !== null && r.c[0].v !== undefined) {
        ref = String(r.c[0].f || r.c[0].v).trim();
      } else if (nome) {
        ref = nome.split("-")[0].replace(/\.[^/.]+$/, "").trim();
      }
      var link = String(r.c[1].v).trim().replace("uc?export=view&id=", "thumbnail?sz=w800&id=");
      if (ref && link) dados.push({ref: ref, link: link, nome: nome});
    }
    document.getElementById("loading-screen").classList.add("hidden");
    document.getElementById("status").textContent = dados.length + " fotos carregadas";
    setTimeout(function() { document.getElementById("status").textContent = ""; }, 2500);
  } catch(e) {
    document.getElementById("loading-screen").classList.add("hidden");
    document.getElementById("status").textContent = "Erro ao carregar";
  }
}

function buscar() {

  grid.innerHTML = "";

  var qB = q.toUpperCase().replace(/R$/, "");

    var r = String(d.ref).toUpperCase().replace(/R$/, "");

    if (qN !== null) return parseInt(r, 10) === qN || parseInt(m, 10) === qN;
    return r === qB || m === qB;
  });
  document.getElementById("div-label").textContent = res.length + (res.length === 1 ? " variacao encontrada" : " variacoes encontradas");

    img.alt = item.ref;

    img.onerror = function() { spin.style.display = "none"; img.style.display = "none"; };

    wrap.appendChild(img);

    info.appendChild(nomeEl);
    card.appendChild(wrap);
    card.appendChild(info);

function carregarGaleria() {
  if (galLoad) return;

  galLoad = true;

var dadosFiltrados = [];
var filtroAtivo = false;

function ordenarDados(arr) {
  return arr.slice().sort(function(a, b) {
    var rA = String(a.ref).toUpperCase();
    var rB = String(b.ref).toUpperCase();
    var isNtA = rA.indexOf("NT") === 0 || rA.indexOf("9999") === 0 || rA.indexOf("9993") === 0 || rA.indexOf("9997") === 0;
    var isNtB = rB.indexOf("NT") === 0 || rB.indexOf("9999") === 0 || rB.indexOf("9993") === 0 || rB.indexOf("9997") === 0;
    // 9999 e NT vão para o final
    if (isNtA && !isNtB) return 1;
    if (!isNtA && isNtB) return -1;
    // demais: ordem decrescente pelo número
    var nA = parseInt(rA.replace(/[^0-9]/g, ""), 10) || 0;
    var nB = parseInt(rB.replace(/[^0-9]/g, ""), 10) || 0;
    return nB - nA;
  });
}

    galLoad = false;
    document.getElementById("galeria-grid").innerHTML = "";
    document.getElementById("g-filtro-info").textContent = "";

    dadosFiltrados = dados.filter(function(d) {
      return String(d.ref).toUpperCase().indexOf("NT") === 0;
    });
    filtroAtivo = true;

      var r = String(d.ref).toUpperCase();
      return r.indexOf("ALM") === 0 || r.indexOf("RIN") === 0 || r.indexOf("MT") === 0 || r.indexOf("PS") === 0;

    document.getElementById("g-filtro-info").textContent = dadosFiltrados.length + " produtos Trico";

}

var TRICO_PREFIXOS = ["ALM", "RIN", "MT", "PS"];

function isTricoPrefixo(q) {
  var qU = q.toUpperCase();
  for (var i = 0; i < TRICO_PREFIXOS.length; i++) {
    if (TRICO_PREFIXOS[i] === qU || TRICO_PREFIXOS[i].indexOf(qU) === 0 || qU.indexOf(TRICO_PREFIXOS[i]) === 0) {
      return TRICO_PREFIXOS[i];
    }
  }
  return null;
}

function filtrarGaleria(q) {
  var grid = document.getElementById("galeria-grid");
  grid.innerHTML = "";
  galPag = 0;
  galLoad = false;
  if (!q) {
    filtroAtivo = false;
    dadosFiltrados = [];
    document.getElementById("g-filtro-info").textContent = "";
    if (dados.length > 0) carregarGaleria();
    return;
  }
  var qU = q.toUpperCase();
  var prefixo = isTricoPrefixo(qU);

  if (prefixo) {
    // Busca por prefixo Tricô — mostra todos que começam com esse prefixo
    dadosFiltrados = dados.filter(function(d) {
      return String(d.ref).toUpperCase().indexOf(prefixo) === 0;
    });
    filtroAtivo = true;
    document.getElementById("g-filtro-info").textContent = dadosFiltrados.length + " produtos " + prefixo;
    renderFiltrados();
    return;
  }

  var qB = qU.replace(/R$/, "");
  var qN = parseInt(qB, 10) || null;
  dadosFiltrados = dados.filter(function(d) {
    var r = String(d.ref).toUpperCase().replace(/R$/, "");
    var m = String(d.nome).toUpperCase().split("-")[0].replace(/R$/, "");
    if (qN !== null) return parseInt(r, 10) === qN || parseInt(m, 10) === qN;
    return r === qB || m === qB;
  });
  filtroAtivo = true;
  document.getElementById("g-filtro-info").textContent = dadosFiltrados.length + (dadosFiltrados.length === 1 ? " variacao encontrada" : " variacoes encontradas");
  renderFiltrados();
}

function isTrico(ref) {
  var r = String(ref).toUpperCase();
  return r.indexOf("ALM") === 0 || r.indexOf("RIN") === 0 || r.indexOf("MT") === 0 || r.indexOf("PS") === 0;
}

function getCorTrico(nome) {
  var partes = String(nome).split("-");
  if (partes.length >= 2) {
    var cor = partes[1].replace(/\.[^/.]+$/, "").trim();
    return cor;
  }
  return "";
}

function renderFiltrados() {
  var grid = document.getElementById("galeria-grid");
  dadosFiltrados.forEach(function(item) {
    var div = document.createElement("div");
    div.className = "g-item";
    var wrap = document.createElement("div");
    wrap.className = "g-img";
    var img = document.createElement("img");
    img.src = item.link;
    img.alt = item.ref;
    img.loading = "lazy";
    wrap.appendChild(img);
    var ref = document.createElement("div");
    ref.className = "g-ref";
    ref.textContent = item.ref;
    div.appendChild(wrap);
    div.appendChild(ref);
    if (isTrico(item.ref)) {
      var cor = getCorTrico(item.nome);
      if (cor) {
        var corEl = document.createElement("div");
        corEl.className = "g-cor";
        corEl.textContent = "Cor: " + cor;
        div.appendChild(corEl);
      }
    }
    div.addEventListener("click", function() { abrirLB(item); });
    grid.appendChild(div);
  });
}

var carrinho = [];

function fabAtualizar() {

function addItem(item, qty) {
  qty = qty || 1;
  var idx = -1;
  for (var i=0; i<carrinho.length; i++) { if (carrinho[i].nome === item.nome) { idx=i; break; } }
  if (idx >= 0) { carrinho[idx].qty += qty; } else { carrinho.push({ref:item.ref, nome:item.nome, link:item.link, qty:qty}); }
  fabAtualizar();
  var fab = document.getElementById("fab");
  fab.style.background = "var(--gold)"; fab.style.color = "var(--dark)";
  setTimeout(function(){ fab.style.background = "var(--dark)"; fab.style.color = "var(--gold-light)"; }, 500);
}

function renderPedido() {
  var lista = document.getElementById("ped-lista");
  lista.innerHTML = "";
  if (carrinho.length === 0) {
    lista.innerHTML = "<div class='ped-vazio'>Nenhum item adicionado ainda</div>";
    return;
  }
  carrinho.forEach(function(item, idx) {
    var div = document.createElement("div");
    div.className = "ped-item";
    var img = document.createElement("img");
    img.src = item.link; img.className = "ped-img"; img.alt = item.ref;
    var info = document.createElement("div"); info.className = "ped-info";
    var ref = document.createElement("div"); ref.className = "ped-ref"; ref.textContent = item.ref;
    var nome = document.createElement("div"); nome.className = "ped-nome"; nome.textContent = item.nome;
    info.appendChild(ref); info.appendChild(nome);
    var qty = document.createElement("div"); qty.className = "ped-qty";
    var menos = document.createElement("button"); menos.className = "qty-btn"; menos.textContent = "-";
    menos.addEventListener("click", (function(i){ return function(){
      if(carrinho[i].qty>1){carrinho[i].qty--;}else{carrinho.splice(i,1);}
      fabAtualizar(); renderPedido();
    };})(idx));
    var num = document.createElement("span"); num.className = "qty-n"; num.textContent = item.qty;
    var mais = document.createElement("button"); mais.className = "qty-btn"; mais.textContent = "+";
    mais.addEventListener("click", (function(i){ return function(){ carrinho[i].qty++; fabAtualizar(); renderPedido(); };})(idx));
    qty.appendChild(menos); qty.appendChild(num); qty.appendChild(mais);
    var rem = document.createElement("button"); rem.className = "ped-rem"; rem.textContent = "✕";
    rem.addEventListener("click", (function(i){ return function(){ carrinho.splice(i,1); fabAtualizar(); renderPedido(); };})(idx));
    div.appendChild(img); div.appendChild(info); div.appendChild(qty); div.appendChild(rem);
    lista.appendChild(div);
  });
}

    var hist = JSON.parse(localStorage.getItem(chave)||"[]");

// PDF
async function gerarPDFeEnviar(cnpj, razao, endereco) {
  var rep = JSON.parse(sessionStorage.getItem("rep")||"{}");
  var btn = document.getElementById("btn-pdf");
  btn.textContent = "Gerando...";
  btn.disabled = true;

  var payload = {
    representante: rep.n||"",
    cnpj: cnpj, razao: razao, endereco: endereco,
    itens: carrinho.map(function(i){ return {ref:i.ref, nome:i.nome, qty:i.qty}; })
  };

  var numPedido = "PED-???";
  try {
    var res = await fetch("https://script.google.com/macros/s/AKfycbyVfxtgfNi8wbCH50kYv_zjC7XeFdC_WMGJP3PeHvDYLy7Td_WtS4qSNr6w1NypcVcc/exec", {
      method: "POST",
      headers: {"Content-Type": "text/plain;charset=utf-8"},
      body: JSON.stringify(payload),
      redirect: "follow"
    });
    var json = await res.json();
    if (json.ok) numPedido = json.pedido;
  } catch(e) {}

  var agora = new Date();
  var dataStr = agora.toLocaleDateString("pt-BR") + " " + agora.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  var total = carrinho.reduce(function(s,i){return s+i.qty;},0);
  var itensStr = carrinho.map(function(i){ return i.ref+" | "+i.nome+" | "+i.qty+" un"; }).join("\n");

  salvarHistorico({numero:numPedido, data:dataStr, cnpj:cnpj, razao:razao, endereco:endereco, total:total, itensStr:itensStr});

  var logoSrc = "";
  var logoEl = document.querySelector(".header-logo");
  if (logoEl) logoSrc = logoEl.src;

  var itensHTML = carrinho.map(function(item) {
    return "<tr><td style='padding:8px;border-bottom:1px solid #EDE6DC;text-align:center'><img src='" + item.link + "' style='width:60px;height:60px;object-fit:contain;border-radius:4px'></td>" +
      "<td style='padding:8px;border-bottom:1px solid #EDE6DC;font-family:Georgia,serif;font-size:13px;color:#B89B6A;font-weight:bold'>" + item.ref + "</td>" +

    ".tot{text-align:right;padding:12px 0;font-size:13px;font-weight:bold;border-top:2px solid #B89B6A;margin-top:8px}" +
    "@media print{body{margin:0}}</style></head><body>" +
    
    "<div style='padding:16px;background:#1C1814;display:flex;gap:12px;justify-content:center;position:sticky;top:0;z-index:99'>" +
    "<button onclick='window.close()' style='background:none;border:2px solid #D4B98A;color:#D4B98A;border-radius:6px;padding:12px 24px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;-webkit-tap-highlight-color:transparent'>&#8592; Voltar</button>" +

    "</div>" +

  var win = window.open("","_blank");

  carrinho = [];
  fabAtualizar();
  renderPedido();

  var agora = new Date();
  var dataStr = agora.toLocaleDateString("pt-BR") + " " + agora.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  var total = carrinho.reduce(function(s,i){return s+i.qty;},0);

  }).join("");

  var pdfHTML = "<!DOCTYPE html><html><head><meta charset='UTF-8'><title>Pedido Mademoiselle</title>" +
    "<style>" +
    "body{font-family:Arial,sans-serif;margin:0;padding:24px;color:#1C1814;background:#fff}" +
    ".hd{text-align:center;border-bottom:2px solid #B89B6A;padding-bottom:16px;margin-bottom:20px}" +
    ".logo{height:55px;margin-bottom:8px}" +

    "table{width:100%;border-collapse:collapse}" +
    "th{background:#1C1814;color:#D4B98A;padding:10px 8px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;text-align:left}" +
    "th:last-child,td:last-child{text-align:center}" +
    ".tot{text-align:right;padding:14px 0 0;font-size:13px;font-weight:bold;border-top:2px solid #B89B6A;margin-top:4px}" +
    "@media print{body{padding:12px}}" +
    "</style></head><body>" +
    
    
    "<div class='hd'>" +
    (logoSrc ? "<img src='" + logoSrc + "' class='logo'>" : "<div style='font-family:Georgia,serif;font-size:22px;color:#B89B6A'>Mademoiselle Almofadas</div>") +
    "<div class='sub'>Rascunho de Pedido</div>" +
    "<div style='font-size:11px;color:#9E8E7E;margin-top:4px'>" + dataStr + " &nbsp;|&nbsp; " + (rep.n||"") + "</div>" +
    "</div>" +
    "<div class='info'>" +
    "<strong style='color:#B89B6A'>Representante:</strong> " + (rep.n||"") + "</div>" +
    "<table><thead><tr><th>Foto</th><th>Ref</th><th>Produto</th><th>Qtd</th></tr></thead>" +
    "<tbody>" + itensHTML + "</tbody></table>" +

  var win = window.open("","_blank");
