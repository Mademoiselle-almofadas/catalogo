<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Mademoiselle Almofadas</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mademoiselle">
<meta name="theme-color" content="#1C1814">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--cream:#F7F3EE;--warm:#EDE6DC;--gold:#B89B6A;--gold-light:#D4B98A;--dark:#1C1814;--mid:#6B5F52;--soft:#9E8E7E;--white:#FDFAF7}
html,body{height:100%;background:var(--cream);color:var(--dark);font-family:'Inter',sans-serif;font-weight:400;font-size:15px}
header{background:var(--dark);padding:22px 24px 0;text-align:center;position:sticky;top:0;z-index:100}
.brand-tag{font-size:9px;font-weight:500;letter-spacing:.28em;color:var(--gold);text-transform:uppercase;margin-bottom:4px}
.header-logo{display:block;height:70px;width:320px;object-fit:contain;margin:0 auto}
.abas{display:flex;border-top:1px solid rgba(255,255,255,.08);margin-top:8px}
.aba-btn{flex:1;background:none;border:none;padding:10px 0;font-family:'Inter',sans-serif;font-size:10px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);cursor:pointer;border-bottom:2px solid transparent;transition:color .2s,border-color .2s}
.aba-btn.ativa{color:var(--gold-light);border-bottom-color:var(--gold)}
#busca-screen{display:none}
#busca-screen.ativo{display:block}
#galeria-screen{display:none}
#galeria-screen.ativo{display:block}
.boas-vindas{display:flex;align-items:center;justify-content:space-between;padding:8px 20px 0;max-width:520px;margin:0 auto}
.bemvindo{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
.bemvindo span{color:var(--gold);font-weight:500}
.sair-btn{background:none;border:none;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);cursor:pointer;text-decoration:underline}
.search-wrap{padding:20px 20px 12px;max-width:520px;margin:0 auto}
.search-label{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);margin-bottom:10px;display:block}
.search-row{display:flex;gap:10px}
.search-input{flex:1;background:var(--white);border:1.5px solid var(--warm);border-radius:4px;padding:14px 18px;font-family:'Inter',sans-serif;font-size:28px;color:var(--dark);letter-spacing:.06em;outline:none;-webkit-appearance:none}
.search-input:focus{border-color:var(--gold)}
.search-btn{background:var(--dark);border:none;border-radius:4px;padding:0 22px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.search-btn svg{width:20px;height:20px;stroke:var(--gold-light);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#status{text-align:center;padding:8px 20px 0;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);min-height:22px}
.divider{display:flex;align-items:center;gap:12px;padding:6px 20px 0;max-width:520px;margin:0 auto}
.divider-line{flex:1;height:1px;background:var(--warm)}
.divider-text{font-size:9px;letter-spacing:.18em;color:var(--soft);text-transform:uppercase}
#grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:16px 16px 40px;max-width:800px;margin:0 auto}
@media(min-width:600px){#grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--white);border-radius:6px;overflow:hidden;box-shadow:0 2px 12px rgba(28,24,20,0.1);cursor:pointer;animation:fadeUp .35s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.card-img{aspect-ratio:4/3;background:var(--warm);overflow:hidden;position:relative}
.card-img img{width:100%;height:100%;object-fit:contain;display:block}
.card-spin{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.spinner{width:24px;height:24px;border:2px solid var(--warm);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.card-info{padding:10px 12px 12px;border-top:1px solid var(--warm)}
.card-ref{font-family:'Inter',sans-serif;font-size:16px;font-weight:600;color:var(--gold);letter-spacing:.08em;display:block;margin-bottom:2px}
.card-nome{font-size:13px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.empty{grid-column:1/-1;text-align:center;padding:48px 20px;color:var(--soft);font-size:13px}
#galeria-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px;max-width:800px;margin:0 auto}
@media(min-width:600px){#galeria-grid{grid-template-columns:repeat(4,1fr)}}
.g-item{background:var(--warm);cursor:pointer}
.g-img{overflow:hidden;background:var(--warm)}
.g-img img{width:100%;height:auto;display:block}
.g-ref{font-family:'Inter',sans-serif;font-size:14px;color:var(--gold);text-align:center;padding:5px 2px 2px;background:var(--white);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-desc{font-size:11px;color:var(--soft);text-align:center;padding:0 2px 4px;background:var(--white);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-cor{font-size:10px;color:var(--soft);text-align:center;padding:0 2px 4px;background:var(--white);letter-spacing:.06em}
#g-sentinel{height:20px}
#g-status{text-align:center;padding:20px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
#lightbox{display:none;position:fixed;inset:0;background:rgba(28,24,20,.92);z-index:500;flex-direction:column;align-items:center;justify-content:center;padding:20px}
#lightbox.open{display:flex}
#lb-img{max-width:100%;max-height:75vh;object-fit:contain;border-radius:4px}
#lb-ref{font-family:'Inter',sans-serif;font-size:22px;color:var(--gold-light);text-align:center;margin-top:16px}
#lb-nome{font-size:11px;color:var(--soft);text-align:center;margin-top:4px}
#lb-close{position:absolute;top:16px;right:20px;background:none;border:none;cursor:pointer;color:var(--soft);font-size:28px;line-height:1}
#loading-screen{position:fixed;inset:0;background:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:300;transition:opacity .4s}
#loading-screen.hidden{opacity:0;pointer-events:none}
.loading-brand{font-family:'Inter',sans-serif;font-size:32px;font-weight:400;color:var(--dark);letter-spacing:.1em}
.loading-brand em{color:var(--gold);font-style:italic}
.loading-bar-wrap{width:140px;height:2px;background:var(--warm);border-radius:2px;overflow:hidden}
.loading-bar{height:100%;background:var(--gold);animation:loadBar 1.8s ease forwards}
@keyframes loadBar{from{width:0}to{width:100%}}
.loading-txt{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft)}
#login-screen{position:fixed;inset:0;background:var(--dark);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:400;padding:24px;transition:opacity .4s}
#login-screen.hidden{opacity:0;pointer-events:none}
.login-logo{display:block;height:90px;width:360px;object-fit:contain;margin:0 auto 40px}
.login-box{background:var(--cream);border-radius:8px;padding:32px 28px;width:100%;max-width:360px}
.login-title{font-family:'Inter',sans-serif;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);text-align:center;margin-bottom:24px}
.login-field{margin-bottom:14px}
.login-label{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);display:block;margin-bottom:6px}
.login-input{width:100%;background:var(--white);border:1.5px solid var(--warm);border-radius:4px;padding:12px 14px;font-family:'Inter',sans-serif;font-size:15px;color:var(--dark);outline:none;-webkit-appearance:none}
.login-input:focus{border-color:var(--gold)}
.login-btn{width:100%;background:var(--dark);color:var(--gold-light);border:none;border-radius:4px;padding:14px;font-family:'Inter',sans-serif;font-size:12px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;margin-top:8px}
.login-erro{font-size:11px;color:#c0392b;text-align:center;margin-top:10px;min-height:16px}

.g-filtro-wrap{padding:12px 12px 8px;max-width:800px;margin:0 auto;position:sticky;top:0;background:var(--cream);z-index:10;border-bottom:1px solid var(--warm)}
.g-filtro-row{display:flex;gap:8px;align-items:center}
.g-cats{display:flex;gap:6px;padding:10px 12px 0;max-width:800px;margin:0 auto;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.g-cats::-webkit-scrollbar{display:none}
.g-cat-btn{background:var(--white);color:var(--soft);border:1.5px solid var(--warm);border-radius:20px;padding:6px 14px;font-family:'Inter',sans-serif;font-size:10px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;white-space:nowrap;transition:all .2s;flex-shrink:0}
.g-cat-btn.ativo{background:var(--dark);color:var(--gold-light);border-color:var(--dark)}
.g-filtro-input{flex:1;background:var(--white);border:1.5px solid var(--warm);border-radius:4px;padding:10px 14px;font-family:'Inter',sans-serif;font-size:20px;color:var(--dark);outline:none;-webkit-appearance:none}
.g-filtro-input:focus{border-color:var(--gold)}
.g-filtro-clear{background:none;border:none;color:var(--soft);font-size:18px;cursor:pointer;padding:4px 8px;display:none}
.g-filtro-clear.visible{display:block}
.g-filtro-info{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--soft);text-align:center;padding:4px 0 0}


.card-img{position:relative}
.g-img{position:relative}
.btn-add{position:absolute;bottom:6px;right:6px;background:var(--dark);color:var(--gold-light);border:none;border-radius:50%;width:30px;height:30px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:5;line-height:1}
#fab{position:fixed;bottom:24px;right:20px;background:var(--dark);color:var(--gold-light);border:none;border-radius:50px;padding:12px 18px;font-family:'Inter',sans-serif;font-size:11px;font-weight:500;letter-spacing:.15em;cursor:pointer;z-index:150;display:none;align-items:center;gap:8px;box-shadow:0 4px 16px rgba(0,0,0,.3)}
#fab.visivel{display:flex}
#fab-n{background:var(--gold);color:var(--dark);border-radius:50%;width:20px;height:20px;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
#pedido-screen{display:none}
#pedido-screen.ativo{display:block}
.ped-header{padding:16px 20px 8px;max-width:800px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
.ped-titulo{font-family:'Inter',sans-serif;font-size:18px;color:var(--dark);letter-spacing:.06em}
.ped-limpar{background:none;border:none;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);cursor:pointer;text-decoration:underline}
.ped-lista{max-width:800px;margin:0 auto;padding:0 16px 100px}
.ped-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--warm)}
.ped-img{width:56px;height:56px;object-fit:contain;border-radius:4px;background:var(--warm);flex-shrink:0}
.ped-info{flex:1;min-width:0}
.ped-ref{font-family:'Inter',sans-serif;font-size:16px;font-weight:600;color:var(--gold)}
.ped-nome{font-size:13px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ped-qty{display:flex;align-items:center;gap:6px;flex-shrink:0}
.qty-btn{background:var(--warm);border:none;border-radius:4px;width:28px;height:28px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--dark)}
.qty-n{font-family:'Inter',sans-serif;font-size:16px;color:var(--dark);min-width:24px;text-align:center}
.ped-rem{background:none;border:none;color:var(--soft);font-size:18px;cursor:pointer;padding:4px;flex-shrink:0}
.ped-vazio{text-align:center;padding:60px 20px;font-size:13px;color:var(--soft)}
.ped-footer{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1px solid var(--warm);padding:12px 20px;z-index:160}
.ped-footer-inner{max-width:800px;margin:0 auto}
.btn-email{width:100%;background:var(--dark);color:var(--gold-light);border:none;border-radius:4px;padding:14px;font-family:'Inter',sans-serif;font-size:11px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;cursor:pointer}
.lb-add-row{display:flex;align-items:center;gap:12px;margin-top:14px;justify-content:center;position:relative;z-index:501}
.lb-qty-btn{background:var(--warm);border:none;border-radius:4px;width:40px;height:40px;font-size:22px;cursor:pointer;color:var(--dark);display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.lb-qty-n{font-family:'Inter',sans-serif;font-size:20px;color:var(--white);min-width:30px;text-align:center}
.lb-add-btn{background:var(--gold);color:var(--dark);border:none;border-radius:4px;padding:12px 24px;font-family:'Inter',sans-serif;font-size:11px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;-webkit-tap-highlight-color:transparent}




/* FORMULÁRIO PEDIDO */
#modal-dados{display:none;position:fixed;inset:0;background:rgba(28,24,20,.7);z-index:600;align-items:center;justify-content:center;padding:20px}
#modal-dados.open{display:flex}
.modal-box{background:var(--cream);border-radius:8px;padding:28px;width:100%;max-width:400px;max-height:90vh;overflow-y:auto;position:relative;z-index:601}
.modal-titulo{font-family:'Inter',sans-serif;font-size:18px;color:var(--dark);letter-spacing:.06em;margin-bottom:20px;text-align:center}
.modal-field{margin-bottom:14px}
.modal-label{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);display:block;margin-bottom:6px}
.modal-input{width:100%;background:var(--white);border:1.5px solid var(--warm);border-radius:4px;padding:11px 14px;font-family:'Inter',sans-serif;font-size:14px;color:var(--dark);outline:none;-webkit-appearance:none}
.modal-input:focus{border-color:var(--gold)}
.modal-btns{display:flex;gap:10px;margin-top:20px}
.modal-btn-cancel{flex:1;background:var(--white);color:var(--soft);border:1.5px solid var(--warm);border-radius:4px;padding:12px;font-family:'Inter',sans-serif;font-size:11px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;cursor:pointer}
.modal-btn-ok{flex:2;background:var(--dark);color:var(--gold-light);border:none;border-radius:4px;padding:12px;font-family:'Inter',sans-serif;font-size:11px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;-webkit-tap-highlight-color:transparent;pointer-events:all}
/* HISTÓRICO */
#historico-screen{display:none}
#historico-screen.ativo{display:block}
.hist-header{padding:16px 20px 8px;max-width:800px;margin:0 auto}
.hist-titulo{font-family:'Inter',sans-serif;font-size:18px;color:var(--dark);letter-spacing:.06em}
.hist-lista{max-width:800px;margin:0 auto;padding:0 16px 40px}
.hist-item{background:var(--white);border-radius:6px;padding:14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(28,24,20,.06)}
.hist-num{font-family:'Inter',sans-serif;font-size:15px;font-weight:600;color:var(--gold);margin-bottom:4px}
.hist-info{font-size:13px;color:var(--soft);margin-bottom:6px}
.hist-itens{font-size:11px;color:var(--dark);line-height:1.7;border-top:1px solid var(--warm);padding-top:8px;margin-top:6px}
.hist-vazio{text-align:center;padding:60px 20px;font-size:13px;color:var(--soft)}
/* Botão PDF */
.btn-baixar{width:100%;background:var(--white);color:var(--dark);border:1.5px solid var(--warm);border-radius:4px;padding:14px;font-family:'Inter',sans-serif;font-size:11px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;cursor:pointer}
.btn-pdf{width:100%;background:var(--gold);color:var(--dark);border:none;border-radius:4px;padding:14px;font-family:'Inter',sans-serif;font-size:11px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;margin-top:10px}


.hist-itens-grid{border-top:1px solid var(--warm);margin-top:10px;padding-top:8px}
.hist-item-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--warm)}
.hist-item-row:last-child{border-bottom:none}
.hist-item-img{width:50px;height:50px;object-fit:contain;border-radius:4px;background:var(--warm);flex-shrink:0}
.hist-item-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.hist-item-ref{font-family:'Inter',sans-serif;font-size:16px;font-weight:600;color:var(--gold)}
.hist-item-nome{font-size:13px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-item-qty{font-size:14px;font-weight:600;color:var(--dark)}


.g-cat-desc{font-size:12px;color:var(--soft);text-align:center;padding:6px 16px 0;max-width:600px;margin:0 auto;font-style:italic;letter-spacing:.03em}


.g-preco{font-size:12px;font-weight:600;color:var(--dark);text-align:center;padding:0 2px 4px;background:var(--white)}
.card-preco{font-size:11px;font-weight:600;color:var(--dark);display:block;margin-top:2px}
.ped-preco{font-size:11px;color:var(--soft)}
.ped-subtotal{font-size:12px;font-weight:600;color:var(--dark);min-width:60px;text-align:right;flex-shrink:0}
.ped-total-valor{font-size:16px;font-weight:700;color:var(--dark);font-family:'Inter',sans-serif}
.ped-total-row{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:2px solid var(--warm);max-width:800px;margin:0 auto}


.g-preco{font-size:12px;color:var(--dark);text-align:center;padding:0 2px 4px;background:var(--white);font-weight:600}
.card-preco{font-size:11px;color:var(--dark);font-weight:600;margin-top:2px;display:block}
.ped-preco{font-size:12px;color:var(--soft)}
.ped-subtotal{font-size:12px;font-weight:600;color:var(--dark)}
.ped-total-preco{text-align:right;padding:12px 16px;font-family:'Inter',sans-serif;font-size:16px;color:var(--dark);border-top:1px solid var(--warm);margin-top:8px}

.g-tam{font-size:11px;color:var(--soft);text-align:center;padding:0 2px 2px;background:var(--white);font-style:italic}
.card-tam{font-size:11px;color:var(--soft);display:block;font-style:italic}
.ped-tam{font-size:11px;color:var(--soft);font-style:italic}

</style>
</head>

async function carregarPlanilha() {
  try {
    var url = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?tqx=out:json&sheet=Sheet1&headers=1";
    var res = await fetch(url);
    var txt = await res.text();
    var json = JSON.parse(txt.substring(47).slice(0, -2));
    var rows = json.table.rows;
    dados = [];
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      if (!r.c || !r.c[1] || !r.c[1].v) continue;
      var nome = (r.c[2] && r.c[2].v) ? String(r.c[2].v).trim() : "";
      var ref = "";
      if (r.c[0] && r.c[0].v !== null && r.c[0].v !== undefined) {
        ref = String(r.c[0].f || r.c[0].v).trim();
      } else if (nome) {
        ref = nome.split("-")[0].replace(/\.[^/.]+$/, "").trim();
      }
      var link = String(r.c[1].v).trim().replace("uc?export=view&id=", "thumbnail?sz=w800&id=");
      var desc  = (r.c[3] && r.c[3].v) ? String(r.c[3].v).trim() : "";
      var ean   = (r.c[4] && r.c[4].v) ? String(r.c[4].f || r.c[4].v).trim() : "";
       var preco   = (r.c[5] && r.c[5].v) ? r.c[5].v : 0;
       var tamanho = (r.c[6] && r.c[6].v) ? String(r.c[6].v).trim() : "";
      if (desc === "Descrição" || desc === "Descricao") { desc = ""; ean = ""; preco = 0; }
       if (ref && link) dados.push({ref: ref, link: link, nome: nome, desc: desc, ean: ean, preco: preco, tamanho: tamanho});
    }
    document.getElementById("loading-screen").classList.add("hidden");
    document.getElementById("status").textContent = dados.length + " fotos carregadas";
    setTimeout(function() { document.getElementById("status").textContent = ""; }, 2500);
  } catch(e) {
    document.getElementById("loading-screen").classList.add("hidden");
    document.getElementById("status").textContent = "Erro ao carregar";
  }
}

function buscar() {
  var q = document.getElementById("search-input").value.trim();
  var grid = document.getElementById("grid");
  grid.innerHTML = "";
  if (!q) { document.getElementById("status").textContent = "Digite uma referencia"; return; }
  var qB = q.toUpperCase().replace(/R$/, "");
  var qN = parseInt(qB, 10) || null;
  var res = dados.filter(function(d) {
    var r = String(d.ref).toUpperCase().replace(/R$/, "");
    var m = String(d.nome).toUpperCase().split("-")[0].replace(/R$/, "");
    if (qN !== null) return parseInt(r, 10) === qN || parseInt(m, 10) === qN;
    return r === qB || m === qB;
  });
  document.getElementById("div-label").textContent = res.length + (res.length === 1 ? " variacao encontrada" : " variacoes encontradas");
  if (res.length === 0) {
    var el = document.createElement("div");
    el.className = "empty";
    el.textContent = "Referencia nao encontrada";
    grid.appendChild(el);
    return;
  }
  res.forEach(function(item, i) {
    var card = document.createElement("div");
    card.className = "card";
    card.style.animationDelay = (i * 0.06) + "s";
    var wrap = document.createElement("div");
    wrap.className = "card-img";
    var spin = document.createElement("div");
    spin.className = "card-spin";
    var sp = document.createElement("div");
    sp.className = "spinner";
    spin.appendChild(sp);
    var img = document.createElement("img");
    img.src = item.link;
    img.alt = item.ref;
    img.loading = "lazy";
    img.onload = function() { spin.style.display = "none"; };
    img.onerror = function() { spin.style.display = "none"; img.style.display = "none"; };
    wrap.appendChild(spin);
    wrap.appendChild(img);
    var info = document.createElement("div");
    info.className = "card-info";
    var refEl = document.createElement("span");
    refEl.className = "card-ref";
    refEl.textContent = item.ref;
    var nomeEl = document.createElement("span");
    nomeEl.className = "card-nome";
    nomeEl.textContent = item.desc || item.nome;
    if (item.tamanho) {
      var tamEl = document.createElement("span");
      tamEl.className = "card-tam";
      tamEl.textContent = item.tamanho;
      info.appendChild(tamEl);
    }
    if (item.preco) {
      var precoEl = document.createElement("span");
      precoEl.className = "card-preco";
      precoEl.textContent = "R$ " + Number(item.preco).toFixed(2).replace(".", ",");
      info.appendChild(precoEl);
    }
    if (item.preco) {
      var precoEl = document.createElement("span");
      precoEl.className = "card-preco";
      precoEl.textContent = "R$ " + Number(item.preco).toFixed(2).replace(".", ",");
      nomeEl.appendChild(precoEl);
    }
    info.appendChild(refEl);
    info.appendChild(nomeEl);
    card.appendChild(wrap);
    card.appendChild(info);
    card.addEventListener("click", function() { abrirLB(item); });
    grid.appendChild(card);
  });
}

function ordenarDados(arr) {
  return arr.slice().sort(function(a, b) {
    var rA = String(a.ref).toUpperCase();
    var rB = String(b.ref).toUpperCase();
    var isNtA = rA.indexOf("NT") === 0 || rA.indexOf("9999") === 0 || rA.indexOf("9993") === 0 || rA.indexOf("9997") === 0;
    var isNtB = rB.indexOf("NT") === 0 || rB.indexOf("9999") === 0 || rB.indexOf("9993") === 0 || rB.indexOf("9997") === 0;
    // 9999 e NT vão para o final
    if (isNtA && !isNtB) return 1;
    if (!isNtA && isNtB) return -1;
    // demais: ordem decrescente pelo número
    var nA = parseInt(rA.replace(/[^0-9]/g, ""), 10) || 0;
    var nB = parseInt(rB.replace(/[^0-9]/g, ""), 10) || 0;
    return nB - nA;
  });
}

var catAtual = "tudo";

  document.getElementById("cat-alm-lisa").classList.toggle("ativo", cat === "alm-lisa");
  document.getElementById("cat-rin-lisa").classList.toggle("ativo", cat === "rin-lisa");

  if (cat === "tudo") {

    galPag = 0;

    document.getElementById("galeria-grid").innerHTML = "";

    dadosFiltrados = dados.filter(function(d) {
      return String(d.ref).toUpperCase().indexOf("NT") === 0;
    });
    filtroAtivo = true;
    document.getElementById("g-filtro-info").textContent = dadosFiltrados.length + " produtos Natal";
    renderFiltrados();
  } else if (cat === "trico") {
    dadosFiltrados = dados.filter(function(d) {
      var r = String(d.ref).toUpperCase();
      return r.indexOf("ALM") === 0 || r.indexOf("RIN") === 0 || r.indexOf("MT") === 0 || r.indexOf("PS") === 0;
    });
    filtroAtivo = true;
    document.getElementById("g-filtro-info").textContent = dadosFiltrados.length + " produtos Trico";
    renderFiltrados();
  } else if (cat === "alm-lisa") {
    dadosFiltrados = dados.filter(function(d) {
      var r = String(d.ref).toUpperCase().replace(/R$/, "");
      var n = parseInt(r, 10);
      return n === 9999 || n === 9993;
    });
    filtroAtivo = true;
    document.getElementById("g-filtro-info").textContent = dadosFiltrados.length + " Almofadas Lisas";
    renderFiltrados();
  } else if (cat === "rin-lisa") {
    dadosFiltrados = dados.filter(function(d) {
      var r = String(d.ref).toUpperCase().replace(/R$/, "");
      var n = parseInt(r, 10);
      return n === 9997;
    });
    filtroAtivo = true;
    document.getElementById("g-filtro-info").textContent = dadosFiltrados.length + " Rineiras Lisas";
    renderFiltrados();
  } else if (cat === "acqua") {
    var acquaNums = ["133","134","206","253","230","252","250"];
    dadosFiltrados = dados.filter(function(d) {
      var desc = String(d.desc || d.nome || "");
      var partes = desc.split("-");
      if (partes.length >= 2) {
        var segundo = partes[1].trim();
        return acquaNums.indexOf(segundo) >= 0;
      }
      return false;
    });
    filtroAtivo = true;
    document.getElementById("g-filtro-info").textContent = dadosFiltrados.length + " produtos Acqua Linea";
    renderFiltrados();

}

var TRICO_PREFIXOS = ["ALM", "RIN", "MT", "PS"];

function isTricoPrefixo(q) {
  var qU = q.toUpperCase();
  for (var i = 0; i < TRICO_PREFIXOS.length; i++) {
    if (TRICO_PREFIXOS[i] === qU || TRICO_PREFIXOS[i].indexOf(qU) === 0 || qU.indexOf(TRICO_PREFIXOS[i]) === 0) {
      return TRICO_PREFIXOS[i];
    }
  }
  return null;
}

function filtrarGaleria(q) {
  var grid = document.getElementById("galeria-grid");
  grid.innerHTML = "";
  galPag = 0;
  galLoad = false;
  if (!q) {
    filtroAtivo = false;
    dadosFiltrados = [];
    document.getElementById("g-filtro-info").textContent = "";
    if (dados.length > 0) carregarGaleria();
    return;
  }
  var qU = q.toUpperCase();
  var qB = qU.replace(/R$/, "");
  var temHifen = qB.indexOf("-") >= 0;

  // Se tem hífen, busca por descrição exata — tem prioridade sobre tudo
  if (temHifen) {
    dadosFiltrados = dados.filter(function(d) {
      var desc = String(d.desc || d.nome || "").toUpperCase();
      return desc.indexOf(qB) === 0 || desc === qB;
    });
    filtroAtivo = true;
    document.getElementById("g-filtro-info").textContent = dadosFiltrados.length + (dadosFiltrados.length === 1 ? " variacao encontrada" : " variacoes encontradas");
    renderFiltrados();
    return;
  }

  var prefixo = isTricoPrefixo(qU);
  if (prefixo) {
    // Busca por prefixo Tricô — mostra todos que começam com esse prefixo
    dadosFiltrados = dados.filter(function(d) {
      return String(d.ref).toUpperCase().indexOf(prefixo) === 0;
    });
    filtroAtivo = true;
    document.getElementById("g-filtro-info").textContent = dadosFiltrados.length + " produtos " + prefixo;
    renderFiltrados();
    return;
  }

  var qN = parseInt(qB, 10) || null;

  dadosFiltrados = dados.filter(function(d) {
    var r    = String(d.ref).toUpperCase().replace(/R$/, "");
    var nome = String(d.nome || "").toUpperCase().split("-")[0].replace(/R$/, "");
    if (qN !== null) return parseInt(r, 10) === qN || parseInt(nome, 10) === qN;
    return r === qB || nome === qB;
  });
  filtroAtivo = true;
  document.getElementById("g-filtro-info").textContent = dadosFiltrados.length + (dadosFiltrados.length === 1 ? " variacao encontrada" : " variacoes encontradas");
  renderFiltrados();
}

function isTrico(ref) {
  var r = String(ref).toUpperCase();
  return r.indexOf("ALM") === 0 || r.indexOf("RIN") === 0 || r.indexOf("MT") === 0 || r.indexOf("PS") === 0;
}

function getCorTrico(nome) {
  var partes = String(nome).split("-");
  if (partes.length >= 2) {
    var cor = partes[1].replace(/\.[^/.]+$/, "").trim();
    return cor;
  }
  return "";
}

function renderFiltrados() {
  var grid = document.getElementById("galeria-grid");
  dadosFiltrados.forEach(function(item) {
    var div = document.createElement("div");
    div.className = "g-item";
    var wrap = document.createElement("div");
    wrap.className = "g-img";
    var img = document.createElement("img");
    img.src = item.link;
    img.alt = item.ref;
    img.loading = "lazy";
    var gBtn = document.createElement("button");
    gBtn.className = "btn-add";
    gBtn.textContent = "+";
    gBtn.addEventListener("click", (function(it){ return function(e){ e.stopPropagation(); addItem(it,1); }; })(item));
    wrap.appendChild(img);
    wrap.appendChild(gBtn);
    var ref = document.createElement("div");
    ref.className = "g-ref";
    ref.textContent = item.ref;
    var gdesc = document.createElement("div");
    gdesc.className = "g-desc";
    gdesc.textContent = item.desc || "";
    var gtam = document.createElement("div");
    gtam.className = "g-tam";
    gtam.textContent = item.tamanho || "";
    var gpreco2 = document.createElement("div");
    gpreco2.className = "g-preco";
    gpreco2.textContent = item.preco ? "R$ " + Number(item.preco).toFixed(2).replace(".", ",") : "";
    div.appendChild(wrap);
    div.appendChild(ref);
    if (item.desc) div.appendChild(gdesc);
    if (item.tamanho) div.appendChild(gtam);
    if (item.preco) div.appendChild(gpreco2);
    if (isTrico(item.ref)) {
      var cor = getCorTrico(item.nome);
      if (cor) {
        var corEl = document.createElement("div");
        corEl.className = "g-cor";
        corEl.textContent = "Cor: " + cor;
        div.appendChild(corEl);
      }
    }
    div.addEventListener("click", (function(it){ return function(){ abrirLB(it); }; })(item));
    grid.appendChild(div);
  });
}

  fetch(API, {method:"POST", body:JSON.stringify({acao:"carregarOrc", codigo:codigo})})

    .then(function(data) {
      if (data.ok && data.itens && data.itens.length > 0) {
        carrinho = data.itens.map(function(i){ return {ref:i.ref, nome:i.nome, link:i.link, qty:i.qty, desc:i.nome, ean:"", preco:i.preco||0, tamanho:i.tamanho||""}; });

    localStorage.setItem(chave, JSON.stringify(carrinho));
    localStorage.setItem(chave + "_orc", orcamentoAtivo || "");
  } catch(e) {}
}

function fabAtualizar() {
  var total = carrinho.reduce(function(s,i){ return s+i.qty; }, 0);
  document.getElementById("fab-n").textContent = total;
  document.getElementById("fab").classList.toggle("visivel", total > 0);
}

function addItem(item, qty) {
  qty = qty || 1;
  var idx = -1;
  for (var i=0; i<carrinho.length; i++) { if (carrinho[i].nome === item.nome) { idx=i; break; } }
  if (idx >= 0) { carrinho[idx].qty += qty; } else { carrinho.push({ref:item.ref, nome:item.nome, link:item.link, qty:qty, desc:item.desc||"", ean:item.ean||"", preco:item.preco||0, tamanho:item.tamanho||""}); }
  fabAtualizar();
  salvarCarrinho();
  var fab = document.getElementById("fab");
  fab.style.background = "var(--gold)"; fab.style.color = "var(--dark)";
  setTimeout(function(){ fab.style.background = "var(--dark)"; fab.style.color = "var(--gold-light)"; }, 500);
}

function renderPedido() {
  var lista = document.getElementById("ped-lista");
  // Mostra botão "Voltar para Orçamentos" se estiver editando um orçamento existente
  var btnVoltar = document.getElementById("btn-voltar-orc");
  if (btnVoltar) btnVoltar.style.display = orcamentoAtivo ? "block" : "none";
  lista.innerHTML = "";
  if (carrinho.length === 0) {
    lista.innerHTML = "<div class='ped-vazio'>Nenhum item adicionado ainda</div>";
    document.getElementById("ped-total-preco").textContent = "";
    return;
  }
  carrinho.forEach(function(item, idx) {
    var div = document.createElement("div");
    div.className = "ped-item";
    var img = document.createElement("img");
    img.src = item.link; img.className = "ped-img"; img.alt = item.ref;
    var info = document.createElement("div"); info.className = "ped-info";
    var ref = document.createElement("div"); ref.className = "ped-ref"; ref.textContent = item.ref;
    var nome = document.createElement("div"); nome.className = "ped-nome"; nome.textContent = item.desc || item.nome;
    var precoInfo = document.createElement("div"); precoInfo.className = "ped-preco";
    precoInfo.textContent = item.preco ? "R$ " + Number(item.preco).toFixed(2).replace(".", ",") + " un" : "";
    info.appendChild(ref); info.appendChild(nome); if(item.preco) info.appendChild(precoInfo);
    var qty = document.createElement("div"); qty.className = "ped-qty";
    var menos = document.createElement("button"); menos.className = "qty-btn"; menos.textContent = "-";
    menos.addEventListener("click", (function(i){ return function(){
      if(carrinho[i].qty>1){carrinho[i].qty--;}else{carrinho.splice(i,1);}
      fabAtualizar(); renderPedido(); salvarCarrinho();
    };})(idx));
    var num = document.createElement("span"); num.className = "qty-n"; num.textContent = item.qty;
    var mais = document.createElement("button"); mais.className = "qty-btn"; mais.textContent = "+";
    mais.addEventListener("click", (function(i){ return function(){ carrinho[i].qty++; fabAtualizar(); renderPedido(); salvarCarrinho(); };})(idx));
    qty.appendChild(menos); qty.appendChild(num); qty.appendChild(mais);
    var rem = document.createElement("button"); rem.className = "ped-rem"; rem.textContent = "✕";
    rem.addEventListener("click", (function(i){ return function(){ carrinho.splice(i,1); fabAtualizar(); renderPedido(); salvarCarrinho(); };})(idx));
    var subtotal = document.createElement("div");
    subtotal.className = "ped-subtotal";
    subtotal.textContent = item.preco ? "R$ " + (Number(item.preco) * item.qty).toFixed(2).replace(".", ",") : "";
    div.appendChild(img); div.appendChild(info); div.appendChild(qty); div.appendChild(subtotal); div.appendChild(rem);
    lista.appendChild(div);
  });
}

// Formata data em qualquer formato (ISO, dd/MM/yyyy, Date) para "dd/MM/yyyy HH:mm"
function formatarDataBR(dataRaw, horaRaw) {
  if (!dataRaw) return "";
  // Só aceita horaRaw se realmente parecer hora (HH:mm ou HH:mm:ss)
  var horaValida = "";
  if (horaRaw && /^\d{1,2}:\d{2}/.test(String(horaRaw))) {
    horaValida = String(horaRaw).substring(0,5);
  }
  var d = null;
  try {
    // Caso 1: já é "dd/MM/yyyy" (com ou sem hora)
    if (typeof dataRaw === "string" && /^\d{2}\/\d{2}\/\d{4}/.test(dataRaw)) {
      var partes = dataRaw.split(" ");
      var data = partes[0];
      var hora = partes[1] || horaValida || "";
      if (hora && /^\d{1,2}:\d{2}/.test(hora)) {
        var hm = hora.split(":");
        hora = (hm[0] || "00").padStart(2,"0") + ":" + (hm[1] || "00").substring(0,2);
        return data + " " + hora;
      }
      return data;
    }
    // Caso 2: ISO string ou outro formato — tenta parsear
    d = new Date(dataRaw);
    if (isNaN(d.getTime())) return String(dataRaw);
    var dd = String(d.getDate()).padStart(2,"0");
    var mm = String(d.getMonth()+1).padStart(2,"0");
    var yyyy = d.getFullYear();
    var hh = String(d.getHours()).padStart(2,"0");
    var mi = String(d.getMinutes()).padStart(2,"0");
    var dataFmt = dd + "/" + mm + "/" + yyyy;
    if (hh === "00" && mi === "00" && horaValida) {
      return dataFmt + " " + horaValida;
    }
    if (hh === "00" && mi === "00") {
      return dataFmt;
    }
    return dataFmt + " " + hh + ":" + mi;
  } catch(e) {
    return String(dataRaw);
  }
}

async function renderHistorico() {
  var rep = JSON.parse(sessionStorage.getItem("rep")||"{}");
  var lista = document.getElementById("hist-lista");
  lista.innerHTML = "<div class='hist-vazio'>Carregando orçamentos...</div>";
  var API = "https://script.google.com/macros/s/AKfycbzIbYP6pSZpRF7N4xzawqV3PSItiaUrjdhwZkAVVA5E9BK_75VpSuY3AOXA1XdkxzCa/exec";

  try {
    var res = await fetch(API, {method:"POST", body:JSON.stringify({acao:"listarOrcs", representante:rep.n||""})});
    var json = await res.json();
    lista.innerHTML = "";

    if (!json.ok || !json.orcs || json.orcs.length === 0) {
      lista.innerHTML = "<div class='hist-vazio'>Nenhum orçamento encontrado</div>";
      return;
    }

    json.orcs.forEach(function(orc) {
      var div = document.createElement("div");
      div.className = "hist-item";

      // Status checkboxes
      var statusDiv = document.createElement("div");
      statusDiv.style.cssText = "display:flex;gap:16px;align-items:center;margin-bottom:8px";
      var isConcluido = orc.status === "Concluído";

      statusDiv.innerHTML =
        "<label style='display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer'>" +
          "<input type='checkbox' " + (orc.status !== "Aberto" ? "checked" : "") + " disabled style='width:15px;height:15px;accent-color:var(--gold)'> Orçamento Gerado" +
        "</label>" +
        "<label style='display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer'>" +
          "<input type='checkbox' " + (isConcluido ? "checked" : "") + " disabled style='width:15px;height:15px;accent-color:#4A7C59'> Venda Concluída" +
        "</label>";

      // Header com código e data
      var header = document.createElement("div");
      header.className = "hist-num";
      header.style.cssText = "display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px";
      var linkOrc = window.location.origin + window.location.pathname + "?orc=" + orc.codigo;
      header.innerHTML =
        "<span>" + orc.codigo + " — " + formatarDataBR(orc.data, orc.hora) + "</span>" +
        "<span style='display:flex;gap:6px;flex-wrap:wrap'>" +
          "<button onclick=\"navigator.clipboard.writeText(\'" + linkOrc + "\').then(function(){alert('Link copiado!')})\" style='background:none;border:1px solid var(--gold);color:var(--gold);border-radius:4px;padding:4px 10px;font-size:10px;cursor:pointer'>🔗 Link</button>" +
          (!isConcluido ? "<button onclick=\"carregarOrcParaEditar(\'" + orc.codigo + "\');\" style='background:var(--gold);border:none;color:#1C1814;border-radius:4px;padding:4px 10px;font-size:10px;cursor:pointer;font-weight:600'>✎ Editar</button>" : "") +
          (!isConcluido ? "<button onclick=\"concluirVendaDoOrc(\'" + orc.codigo + "\');\" style='background:#4A7C59;border:none;color:#fff;border-radius:4px;padding:4px 10px;font-size:10px;cursor:pointer;font-weight:600'>✓ Concluir Venda</button>" : "") +
          (!isConcluido ? "<button onclick=\"excluirOrc(\'" + orc.codigo + "\');\" style='background:none;border:1px solid #B85850;color:#B85850;border-radius:4px;padding:4px 10px;font-size:10px;cursor:pointer'>🗑 Excluir</button>" : "") +
        "</span>";

      // Info — total em unidades e em R$
      var totalReais = 0;
      if (orc.itens && orc.itens.length > 0) {
        orc.itens.forEach(function(it){
          totalReais += (Number(it.preco)||0) * (Number(it.qty)||0);
        });
      }
      var info = document.createElement("div");
      info.className = "hist-info";
      info.innerHTML = "Rep: " + (orc.rep||"") + " &nbsp;|&nbsp; Total: <strong>" + (orc.total||0) + " unidades</strong>" +
        (totalReais > 0 ? " &nbsp;|&nbsp; <strong style='color:var(--gold)'>R$ " + totalReais.toFixed(2).replace(".",",") + "</strong>" : "");

      div.appendChild(statusDiv);
      div.appendChild(header);
      div.appendChild(info);

      // Itens com mini fotos
      if (orc.itens && orc.itens.length > 0) {
        var itensDiv = document.createElement("div");
        itensDiv.className = "hist-itens-grid";
        orc.itens.forEach(function(item) {
          var row = document.createElement("div");
          row.className = "hist-item-row";
          var img = document.createElement("img");
          img.src = String(item.link||"").replace("uc?export=view&id=","thumbnail?sz=w200&id=");
          img.className = "hist-item-img";
          img.alt = item.ref;
          var info2 = document.createElement("div");
          info2.className = "hist-item-info";

          // Ordem: REF → TAMANHO → NOME → QTY (un) + PREÇO UNITÁRIO + SUBTOTAL
          var ref = document.createElement("span");
          ref.className = "hist-item-ref";
          ref.textContent = item.ref;
          info2.appendChild(ref);

          if (item.tamanho) {
            var tamEl = document.createElement("span");
            tamEl.className = "hist-item-nome";
            tamEl.style.fontStyle = "italic";
            tamEl.textContent = item.tamanho;
            info2.appendChild(tamEl);
          }

          var nome = document.createElement("span");
          nome.className = "hist-item-nome";
          nome.textContent = item.nome||"";
          info2.appendChild(nome);

          var qty = document.createElement("span");
          qty.className = "hist-item-qty";
          var precoUn = Number(item.preco)||0;
          var subtotal = precoUn * (Number(item.qty)||0);
          if (precoUn > 0) {
            qty.innerHTML = item.qty + " un &nbsp;×&nbsp; <span style='color:#9E8E7E;font-weight:500'>R$ " + precoUn.toFixed(2).replace(".",",") + "</span> &nbsp;=&nbsp; <strong style='color:var(--gold)'>R$ " + subtotal.toFixed(2).replace(".",",") + "</strong>";
          } else {
            qty.textContent = item.qty + " un";
          }
          info2.appendChild(qty);

          row.appendChild(img);
          row.appendChild(info2);
          itensDiv.appendChild(row);
        });
        div.appendChild(itensDiv);
      }

      lista.appendChild(div);
    });

  } catch(e) {
    lista.innerHTML = "<div class='hist-vazio'>Erro ao carregar orçamentos: " + e.message + "</div>";
  }
}

function carregarOrcParaEditar(codigo) {
  if (carrinho.length > 0 && orcamentoAtivo !== codigo) {
    if (!confirm("Substituir carrinho atual pelo orçamento " + codigo + "?")) return;
  }
  var API = "https://script.google.com/macros/s/AKfycbzIbYP6pSZpRF7N4xzawqV3PSItiaUrjdhwZkAVVA5E9BK_75VpSuY3AOXA1XdkxzCa/exec";
  fetch(API, {method:"POST", body:JSON.stringify({acao:"carregarOrc", codigo:codigo})})
    .then(function(r){ return r.json(); })
    .then(function(data) {
      if (data.ok && data.itens) {
        carrinho = data.itens.map(function(i){ return {ref:i.ref, nome:i.nome, link:i.link, qty:i.qty, desc:i.nome, ean:"", preco:i.preco||0, tamanho:i.tamanho||""}; });
        orcamentoAtivo = codigo;
        salvarCarrinho();
        // Recupera dados do cliente desse orçamento
        if (data.cnpj || data.razao || data.endereco || data.prazos) {
          dadosCliente = {
            cnpj: data.cnpj || "",
            razao: data.razao || "",
            endereco: data.endereco || "",
            prazos: data.prazos || ""
          };
          salvarDadosCliente();
        } else {
          carregarDadosCliente();
        }
        fabAtualizar();
        mudarAba("p");
      }
    });
}

// Concluir Venda (botão da aba Pedido): se já tem dados, gera PDF direto; senão abre modal
function concluirVenda() {
  if (carrinho.length === 0) { alert("Nenhum item no pedido!"); return; }
  carregarDadosCliente();
  if (temDadosClienteCompletos()) {
    gerarPDFeEnviar(dadosCliente.cnpj, dadosCliente.razao, dadosCliente.endereco, dadosCliente.prazos);
  } else {
    abrirModalDados("venda");
  }
}

// Excluir orçamento (somente não concluídos)
function excluirOrc(codigo) {
  if (!confirm("Excluir o orçamento " + codigo + "?\n\nEssa ação não pode ser desfeita.")) return;
  var API = "https://script.google.com/macros/s/AKfycbzIbYP6pSZpRF7N4xzawqV3PSItiaUrjdhwZkAVVA5E9BK_75VpSuY3AOXA1XdkxzCa/exec";
  fetch(API, {method:"POST", body:JSON.stringify({acao:"excluirOrc", codigo:codigo})})
    .then(function(r){ return r.json(); })
    .then(function(data) {
      if (data.ok) {
        // Se o orçamento excluído é o que está em edição, limpa o carrinho
        if (orcamentoAtivo === codigo) {
          carrinho = [];
          orcamentoAtivo = null;
          dadosCliente = {cnpj:"",razao:"",endereco:"",prazos:""};
          fabAtualizar();
          renderPedido();
          salvarCarrinho();
        }
        renderHistorico();
      } else {
        alert("Erro ao excluir: " + (data.erro || ""));
      }
    })
    .catch(function(){ alert("Erro de conexão ao excluir orçamento."); });
}

// Concluir venda direto da aba Orçamentos: carrega o orçamento e abre o modal de dados
function concluirVendaDoOrc(codigo) {
  if (carrinho.length > 0 && orcamentoAtivo !== codigo) {
    if (!confirm("Substituir carrinho atual pelo orçamento " + codigo + " para concluir a venda?")) return;
  }
  var API = "https://script.google.com/macros/s/AKfycbzIbYP6pSZpRF7N4xzawqV3PSItiaUrjdhwZkAVVA5E9BK_75VpSuY3AOXA1XdkxzCa/exec";
  fetch(API, {method:"POST", body:JSON.stringify({acao:"carregarOrc", codigo:codigo})})
    .then(function(r){ return r.json(); })
    .then(function(data) {
      if (data.ok && data.itens && data.itens.length > 0) {
        carrinho = data.itens.map(function(i){ return {ref:i.ref, nome:i.nome, link:i.link, qty:i.qty, desc:i.nome, ean:"", preco:i.preco||0, tamanho:i.tamanho||""}; });
        orcamentoAtivo = codigo;
        salvarCarrinho();
        fabAtualizar();
        renderPedido();

        // Tenta usar dados do orçamento (do backend) ou do localStorage
        if (data.cnpj || data.razao || data.endereco || data.prazos) {
          dadosCliente = {
            cnpj: data.cnpj || "",
            razao: data.razao || "",
            endereco: data.endereco || "",
            prazos: data.prazos || ""
          };
          salvarDadosCliente();
        } else {
          carregarDadosCliente();
        }

        // Se já tem dados completos, gera PDF direto; senão abre modal
        if (temDadosClienteCompletos()) {
          gerarPDFeEnviar(dadosCliente.cnpj, dadosCliente.razao, dadosCliente.endereco, dadosCliente.prazos);
        } else {
          abrirModalDados("venda");
        }
      } else {
        alert("Não foi possível carregar o orçamento " + codigo);
      }
    })
    .catch(function(){ alert("Erro de conexão ao carregar orçamento."); });
}

// ── DADOS DO CLIENTE (CNPJ/RAZÃO/ENDEREÇO/PRAZOS) ──
// Persistidos por orçamento no localStorage; também em memória
var dadosCliente = { cnpj:"", razao:"", endereco:"", prazos:"" };
var _modalModo = "venda"; // "orcamento" (pular permitido) ou "venda" (obrigatório)

function chaveDadosOrc(codigo) {
  return "dadosOrc_" + (codigo || "rascunho");
}

function salvarDadosCliente() {
  try {
    var rep = JSON.parse(sessionStorage.getItem("rep")||"{}");
    var chave = "dadosCli_" + (rep.u||"x") + "_" + (orcamentoAtivo || "rascunho");
    localStorage.setItem(chave, JSON.stringify(dadosCliente));
  } catch(e) {}
}

function carregarDadosCliente() {
  try {
    var rep = JSON.parse(sessionStorage.getItem("rep")||"{}");
    var chave = "dadosCli_" + (rep.u||"x") + "_" + (orcamentoAtivo || "rascunho");
    var s = localStorage.getItem(chave);
    if (s) {
      var d = JSON.parse(s);
      // Garante todas as chaves
      dadosCliente = {
        cnpj: d.cnpj || "",
        razao: d.razao || "",
        endereco: d.endereco || "",
        prazos: d.prazos || ""
      };
    } else {
      dadosCliente = { cnpj:"", razao:"", endereco:"", prazos:"" };
    }
  } catch(e) {
    dadosCliente = { cnpj:"", razao:"", endereco:"", prazos:"" };
  }
}

function temDadosClienteCompletos() {
  return !!(dadosCliente.cnpj && dadosCliente.razao && dadosCliente.endereco && dadosCliente.prazos);
}

// MODAL
function abrirModalDados(modo) {
  if (carrinho.length === 0) { alert("Nenhum item no pedido!"); return; }
  _modalModo = modo || "venda";
  carregarDadosCliente();

  // Pré-preenche se já existir
  document.getElementById("inp-cnpj").value = dadosCliente.cnpj || "";
  document.getElementById("inp-razao").value = dadosCliente.razao || "";
  document.getElementById("inp-endereco").value = dadosCliente.endereco || "";
  document.getElementById("inp-prazos").value = dadosCliente.prazos || "";

  // Ajusta título e botões conforme o modo
  var titulo = document.getElementById("modal-titulo");
  var btnOk = document.getElementById("modal-btn-ok");
  var btnCancel = document.getElementById("modal-btn-cancel");
  if (_modalModo === "orcamento") {
    titulo.textContent = "Dados do Cliente (Opcional)";
    btnOk.textContent = "Salvar e Gerar Orçamento";
    btnCancel.textContent = "Pular";
  } else {
    titulo.textContent = "Dados do Pedido";
    btnOk.textContent = "Gerar PDF e Enviar";
    btnCancel.textContent = "Cancelar";
  }

  document.getElementById("modal-dados").classList.add("open");
}

function cancelarModal() {
  document.getElementById("modal-dados").classList.remove("open");
  if (_modalModo === "orcamento") {
    // Pulou no modo orçamento → gera orçamento sem dados do cliente
    _gerarOrcamentoBackend();
  }
  // Se for modo venda, só fecha (cancelou)
}

function confirmarModal() {
  var cnpj = document.getElementById("inp-cnpj").value.trim();
  var razao = document.getElementById("inp-razao").value.trim();
  var end = document.getElementById("inp-endereco").value.trim();
  var prazos = document.getElementById("inp-prazos").value.trim();

  if (_modalModo === "orcamento") {
    // No modo orçamento: se preencheu, salva; se vazio, trata como pular
    if (!cnpj && !razao && !end && !prazos) {
      document.getElementById("modal-dados").classList.remove("open");
      _gerarOrcamentoBackend();
      return;
    }
    // Permite salvar parcial — mas pelo menos um campo preenchido
    dadosCliente = { cnpj:cnpj, razao:razao, endereco:end, prazos:prazos };
    salvarDadosCliente();
    document.getElementById("modal-dados").classList.remove("open");
    _gerarOrcamentoBackend();
  } else {
    // Modo venda: todos obrigatórios
    if (!cnpj || !razao || !end || !prazos) { alert("Preencha todos os campos!"); return; }
    dadosCliente = { cnpj:cnpj, razao:razao, endereco:end, prazos:prazos };
    salvarDadosCliente();
    document.getElementById("modal-dados").classList.remove("open");
    gerarPDFeEnviar(cnpj, razao, end, prazos);
  }
}

    "<table><thead><tr><th>Foto</th><th>Ref</th><th>Produto</th><th>Qtd</th><th>Unit.</th><th>Subtotal</th></tr></thead>" +
    "<tbody>" + itensHTML + "</tbody></table>" +
    "<div class='tot'>Total: " + total + " unidades" + (carrinho.reduce(function(s,i){return s+(Number(i.preco)||0)*i.qty;},0) > 0 ? " &nbsp;|&nbsp; R$ " + carrinho.reduce(function(s,i){return s+(Number(i.preco)||0)*i.qty;},0).toFixed(2).replace(".",",") : "") + "</div>" +
    "<\/body><\/html>";

  var win = window.open("","_blank");

  if (win) {

    win.document.write(pdfHTML);
    win.document.close();
    win.onload = function(){ win.focus(); win.print(); };
  }
}

new IntersectionObserver(function(entries) {
  if (entries[0].isIntersecting && galAtiva) carregarGaleria();
}, {rootMargin: "200px"}).observe(document.getElementById("g-sentinel"));

function abrirLB(item) {
  lbItem = item;
  lbQty = 1;
  document.getElementById("lb-qty").textContent = "1";
  document.getElementById("lb-img").src = item.link;
  document.getElementById("lb-ref").textContent = item.ref;
  document.getElementById("lb-nome").textContent = item.nome;
  document.getElementById("lightbox").classList.add("open");
}

function fecharLB() {
  document.getElementById("lightbox").classList.remove("open");
  document.getElementById("lb-img").src = "";
}
